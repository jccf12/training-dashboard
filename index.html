<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Training Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.04);
  --accent: #2a78d6;
  --c-run: #2a78d6;
  --c-bike: #eb6834;
  --c-swim: #1baf7a;
  --c-strength: #eda100;
  --c-other: #e87ba4;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --danger-text: #b42323;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --wash: rgba(255,255,255,0.05);
    --accent: #3987e5;
    --c-run: #3987e5;
    --c-bike: #d95926;
    --c-swim: #199e70;
    --c-strength: #c98500;
    --c-other: #d55181;
    --danger-text: #f07a7a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --accent: #3987e5; --c-run: #3987e5; --c-bike: #d95926; --c-swim: #199e70;
  --c-strength: #c98500; --c-other: #d55181; --danger-text: #f07a7a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 17px; margin: 32px 0 4px; font-weight: 650; }
h3 { font-size: 15px; margin: 0; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; min-width: 0;
}
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

/* Lock screen */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#lock form { width: 100%; max-width: 360px; }
#lock label { display: block; font-size: 13px; color: var(--ink-2); margin: 16px 0 6px; }
#lock input[type=password] {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--axis);
  background: var(--page);
}
#lock .row { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: 13px; color: var(--ink-2); }
.btn {
  border: 1px solid var(--axis); background: var(--surface); border-radius: 8px;
  padding: 8px 14px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; font-weight: 600; }
.btn:disabled { opacity: .6; cursor: progress; }
#lock .err { color: var(--danger-text); font-size: 13px; min-height: 1.4em; margin-top: 8px; }

/* Header + filters */
header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
header.top .meta { font-size: 13px; color: var(--ink-2); }
.filters {
  position: sticky; top: 0; z-index: 5; background: var(--page);
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 0; margin-top: 8px;
  border-bottom: 1px solid var(--border);
}
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--page); font-weight: 600; }
.filters .label { font-size: 12px; color: var(--muted); }

/* Stat tiles */
.tile .k { font-size: 12px; color: var(--ink-2); }
.tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .v2 { font-size: 13px; color: var(--ink-2); }
.hero .v { font-size: 48px; line-height: 1.05; font-weight: 650; }

/* Discipline cards */
.disc header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.disc .big { font-size: 28px; font-weight: 650; line-height: 1.1; }
.disc .big small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 12px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.kv dd .alt { color: var(--muted); display: block; font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 3; display: none;
}
.tip .t { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .key { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.legend .line.faint { opacity: .35; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
details.table { margin-top: 8px; font-size: 13px; }
details.table summary { cursor: pointer; color: var(--ink-2); }
.whoop-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.whoop-card .now { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
.whoop-card .now .v { font-size: 24px; font-weight: 600; }
.whoop-card .now .d { font-size: 12px; color: var(--ink-2); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Tables */
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td .alt { color: var(--muted); }
td.name { white-space: normal; min-width: 160px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar input[type=search] {
  flex: 1 1 180px; min-width: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--page);
}
.more { margin-top: 10px; }
footer { margin: 40px 0 24px; font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .hero .v { font-size: 40px; }
  .whoop-grid { grid-template-columns: 1fr; }
  h2 { margin-top: 24px; }
  .filters { position: static; }
  td .tname { display: none; }
  td.name { min-width: 120px; }
}
</style>
</head>
<body>

    <input type="text" name="username" value="dashboard" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div class="row"><input id="remember" type="checkbox" checked><label for="remember" style="margin:0">Remember this device</label></div>
    <button class="btn primary" id="unlock" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>

<script>
"use strict";
(() => {
const KEY_STORE = "td.key.v1";
const envl = JSON.parse(document.getElementById("payload").textContent);

// ---------- storage (may be unavailable) ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// ---------- crypto ----------
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u8 => btoa(String.fromCharCode(...u8));
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: b64d(envl.salt), iterations: envl.iter }, base, 256);
  return new Uint8Array(bits);
}
async function decryptWith(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(envl.iv) }, key, b64d(envl.ct));
  let bytes = new Uint8Array(pt);
  if (envl.gzip) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

const lockEl = document.getElementById("lock");
const appEl = document.getElementById("app");
const errEl = document.getElementById("err");

async function tryRemembered() {
  const saved = store.get(KEY_STORE);
  if (!saved) return false;
  try { start(await decryptWith(b64d(saved))); return true; }
  catch { store.del(KEY_STORE); return false; }  // password or salt changed
}
document.getElementById("lockform").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("unlock");
  errEl.textContent = ""; btn.disabled = true; btn.textContent = "Decrypting...";
  try {
    if (!window.crypto || !crypto.subtle) throw new Error("insecure");
    const raw = await deriveRaw(document.getElementById("pw").value);
    let data;
    try { data = await decryptWith(raw); }
    catch { errEl.textContent = "Wrong password."; return; }
    if (document.getElementById("remember").checked) store.set(KEY_STORE, b64e(raw));
    start(data);
  } catch (ex) {
    errEl.textContent = ex.message === "insecure"
      ? "This page must be opened over HTTPS to decrypt." : "Could not decrypt this page in this browser.";
  } finally { btn.disabled = false; btn.textContent = "Unlock"; }
});

// ---------- DOM helpers ----------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

// ---------- formatting ----------
const M_PER_MI = 1609.344, YD_PER_M = 1.0936133, FT_PER_M = 3.28084;
const pad2 = n => String(n).padStart(2, "0");
const fmtInt = n => Math.round(n).toLocaleString("en-US");
function fmtDur(sec) {
  if (!sec) return "0m";
  const hh = Math.floor(sec / 3600), mm = Math.round((sec % 3600) / 60);
  if (mm === 60) return `${hh + 1}h 00m`;
  return hh ? `${hh}h ${pad2(mm)}m` : `${mm}m`;
}
function fmtClock(sec) {
  if (!isFinite(sec) || sec <= 0) return "-";
  sec = Math.round(sec);
  const hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
  return hh ? `${hh}:${pad2(mm)}:${pad2(ss)}` : `${mm}:${pad2(ss)}`;
}
const fmtPace = spu => fmtClock(spu);
function distPair(kind, m) {
  if (kind === "swim") return [`${fmtInt(m)} m`, `${fmtInt(m * YD_PER_M)} yd`];
  return [`${(m / 1000).toFixed(1)} km`, `${(m / M_PER_MI).toFixed(1)} mi`];
}
function paceKind(sport, g) {
  if (g === "swim") return "swim";
  if (g === "run" || /Walk|Hike|Snowshoe/.test(sport)) return "pace";
  if (g === "bike" || /Ski|Skate|Row|Canoe|Kayak|Paddle|Inline/.test(sport)) return "speed";
  return null;  // strength, court sports, generic workouts: pace is meaningless
}
function pacePair(kind, dist, mt) {
  if (!kind || !dist || !mt) return null;
  const v = dist / mt;
  if (kind === "swim") return [`${fmtPace(100 / v)} /100m`, `${fmtPace(91.44 / v)} /100yd`];
  if (kind === "speed") return [`${(v * 3.6).toFixed(1)} km/h`, `${(v * 2.236936).toFixed(1)} mph`];
  return [`${fmtPace(1000 / v)} /km`, `${fmtPace(M_PER_MI / v)} /mi`];
}
const elevPair = m => [`${fmtInt(m)} m`, `${fmtInt(m * FT_PER_M)} ft`];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const parseD = d => new Date(d + "T00:00:00Z");
const isoD = dt => dt.toISOString().slice(0, 10);
const addDays = (d, n) => isoD(new Date(parseD(d).getTime() + n * 864e5));
const fmtD = d => { const x = parseD(d); return `${MONTHS[x.getUTCMonth()]} ${x.getUTCDate()}`; };
const fmtDY = d => { const x = parseD(d); return `${MONTHS[x.getUTCMonth()]} ${x.getUTCDate()}, ${x.getUTCFullYear()}`; };
function todayLocal() { const n = new Date(); return `${n.getFullYear()}-${pad2(n.getMonth() + 1)}-${pad2(n.getDate())}`; }
function mondayOf(d) { const x = parseD(d); const wd = (x.getUTCDay() + 6) % 7; return addDays(d, -wd); }

// ---------- config ----------
const DISC = [
  { key: "run", label: "Run", color: "var(--c-run)", kind: "pace", fastMin: 5000, elev: true },
  { key: "bike", label: "Bike", color: "var(--c-bike)", kind: "speed", fastMin: 20000, elev: true, power: true },
  { key: "swim", label: "Swim", color: "var(--c-swim)", kind: "swim", fastMin: 400 },
  { key: "strength", label: "Strength", color: "var(--c-strength)", kind: null },
  { key: "other", label: "Other", color: "var(--c-other)", kind: null },
];
const DISC_BY = Object.fromEntries(DISC.map(d => [d.key, d]));
const PERIODS = [
  { key: "7d", label: "7 days", days: 7 },
  { key: "28d", label: "4 weeks", days: 28 },
  { key: "90d", label: "3 months", days: 90 },
  { key: "ytd", label: "This year" },
  { key: "365d", label: "12 months", days: 365 },
  { key: "all", label: "All time" },
];
const WHOOP_METRICS = [
  { k: "rec", label: "Recovery", fmt: v => `${Math.round(v)}%`, domain: [0, 100], status: true },

// ---------- state ----------
const state = { period: store.get("td.period") || "90d", unit: store.get("td.unit") || "km",
  distDisc: "run", actFilter: "all", actQuery: "", actLimit: 30 };
let DATA = null;

function periodStart(key, today) {
  const p = PERIODS.find(p => p.key === key) || PERIODS[2];
  if (p.days) return addDays(today, -(p.days - 1));
  if (p.key === "ytd") return today.slice(0, 4) + "-01-01";
  const first = [DATA.activities.at(-1)?.d, DATA.whoop[0]?.d].filter(Boolean).sort()[0];
  return first || today;
}

// ---------- aggregation ----------
function agg(list) {
  const o = { n: list.length, dist: 0, mt: 0, distMt: 0, elev: 0, re: 0, hrT: 0, hrW: 0, mhr: 0,
    pwT: 0, pwW: 0, longest: null, fastest: null, days: new Set() };
  for (const a of list) {
    o.mt += a.mt || 0; o.elev += a.elev || 0; o.re += a.re || 0; o.days.add(a.d);
    if (a.dist > 0 && a.mt) { o.dist += a.dist; o.distMt += a.mt; }
    if (a.hr && a.mt) { o.hrT += a.hr * a.mt; o.hrW += a.mt; }
    if (a.mhr) o.mhr = Math.max(o.mhr, a.mhr);
    if (a.realpw && a.pw && a.mt) { o.pwT += a.pw * a.mt; o.pwW += a.mt; }
    if (a.dist > 0 && (!o.longest || a.dist > o.longest.dist)) o.longest = a;
  }
  o.hr = o.hrW ? o.hrT / o.hrW : null;
  o.pw = o.pwW ? o.pwT / o.pwW : null;
  return o;
}
function fastestOf(list, minDist) {
  let best = null;
  for (const a of list) if (a.dist >= minDist && a.mt && (!best || a.dist / a.mt > best.dist / best.mt)) best = a;
  return best;
}

// ---------- tooltip ----------
function makeTip(wrap) { const t = h("div", { class: "tip" }); wrap.append(t); return t; }
function showTip(tip, wrap, x, y, title, rows) {
  tip.replaceChildren(h("div", { class: "t", text: title }),
    ...rows.map(r => h("div", { class: "r" },
      r.color ? h("span", { class: "key", style: `background:${r.color};opacity:${r.faint ? .4 : 1}` }) : null,
      h("b", { text: r.value }), h("span", { class: "ink2", text: r.label }))));
  tip.style.display = "block";
  const W = wrap.clientWidth, tw = tip.offsetWidth;
  let left = x + 12; if (left + tw > W) left = Math.max(0, x - tw - 12);
  tip.style.left = left + "px"; tip.style.top = Math.max(0, y - 10) + "px";
}
const hideTip = tip => { tip.style.display = "none"; };

function niceScale(maxV, ticks = 4) {
  if (!(maxV > 0)) return { max: 1, step: 0.25 };
  const raw = maxV / ticks, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  return { max: Math.ceil(maxV / step - 1e-9) * step, step };
}
function roundTopPath(x, y, w, hgt, r) {
  r = Math.min(r, w / 2, hgt);
  return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`;
}

// ---------- stacked / single column chart ----------
function columnChart(wrap, buckets, series, fmtV, axisFmt) {
  wrap.replaceChildren();
  const W = Math.max(280, wrap.clientWidth), H = 220, ml = 44, mr = 8, mt = 10, mb = 24;
  const iw = W - ml - mr, ih = H - mt - mb;
  const totals = buckets.map(b => series.reduce((acc, sr) => acc + (b.v[sr.key] || 0), 0));
  const sc = niceScale(Math.max(0, ...totals));
  const y = v => mt + ih - (v / sc.max) * ih;
  const band = iw / Math.max(1, buckets.length), bw = Math.max(2, Math.min(24, band * 0.72));
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  for (let v = 0; v <= sc.max + 1e-9; v += sc.step) {
    svg.append(s("line", { x1: ml, x2: W - mr, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    svg.append(s("text", { x: ml - 6, y: y(v) + 4, "text-anchor": "end" }, axisFmt(v)));
  }
  const hl = s("rect", { x: 0, y: mt, width: band, height: ih, fill: "var(--wash)", opacity: 0 });
  svg.append(hl);
  const labelEvery = Math.ceil(buckets.length / Math.max(1, Math.floor(iw / 64)));
  buckets.forEach((b, i) => {
    const cx = ml + band * i + band / 2, x0 = cx - bw / 2;
    let acc = 0;
    const segs = series.filter(sr => (b.v[sr.key] || 0) > 0);
    segs.forEach((sr, j) => {
      const v = b.v[sr.key];
      const yTop = y(acc + v), yBot = y(acc);
      const gap = j > 0 ? 2 : 0;           // 2px surface gap between stacked segments
      const hgt = Math.max(0, yBot - yTop - gap);
      if (j === segs.length - 1) svg.append(s("path", { d: roundTopPath(x0, yTop, bw, hgt, 4), fill: sr.color }));
      else svg.append(s("rect", { x: x0, y: yTop, width: bw, height: hgt, fill: sr.color }));
      acc += v;
    });
    if (i % labelEvery === 0) svg.append(s("text", { x: cx, y: H - 6, "text-anchor": "middle" }, b.short));
  });
  const tip = makeTip(wrap);
  const hit = s("rect", { x: ml, y: mt, width: iw, height: ih, fill: "transparent" });
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const i = Math.min(buckets.length - 1, Math.max(0, Math.floor((px - ml) / band)));
    const b = buckets[i];
    hl.setAttribute("x", ml + band * i); hl.setAttribute("width", band); hl.setAttribute("opacity", 1);
    const rows = series.filter(sr => b.v[sr.key]).map(sr => ({ color: sr.color, value: fmtV(b.v[sr.key]), label: sr.label }));
    if (series.length > 1) rows.push({ value: fmtV(totals[i]), label: "Total" });
    if (!rows.length) rows.push({ value: fmtV(0), label: "" });
    showTip(tip, wrap, (ml + band * i + band / 2) * (r.width / W), 0, b.label, rows);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hideTip(tip); hl.setAttribute("opacity", 0); });
  svg.append(hit);
  wrap.prepend(svg);
}

// ---------- line chart (daily faint + 7-day avg) ----------
function rolling(pts, win = 7) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const t0 = parseD(pts[i].d).getTime() - (win - 1) * 864e5;
    let sum = 0, n = 0;
    for (let j = i; j >= 0 && parseD(pts[j].d).getTime() >= t0; j--) { sum += pts[j].v; n++; }
    out.push({ d: pts[i].d, v: sum / n });
  }
  return out;
}
function lineChart(wrap, pts, m, range) {
  wrap.replaceChildren();
  const W = Math.max(280, wrap.clientWidth), H = 150, ml = 40, mr = 10, mt = 8, mb = 22;
  const iw = W - ml - mr, ih = H - mt - mb;
  const avg = rolling(pts);
  const t0 = parseD(range[0]).getTime(), t1 = Math.max(parseD(range[1]).getTime(), t0 + 864e5);
  const x = d => ml + ((parseD(d).getTime() - t0) / (t1 - t0)) * iw;
  let lo, hi;
  if (m.domain) [lo, hi] = m.domain;
  else {
    const vs = pts.map(p => p.v); lo = Math.min(...vs); hi = Math.max(...vs);
    const padV = (hi - lo) * 0.15 || Math.abs(hi) * 0.05 || 1; lo -= padV; hi += padV;
  }
  const y = v => mt + ih - ((v - lo) / (hi - lo)) * ih;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const sc = niceScale(hi - lo, 3);
  const firstTick = Math.ceil(lo / sc.step) * sc.step;
  for (let v = firstTick; v <= hi + 1e-9; v += sc.step) {
    svg.append(s("line", { x1: ml, x2: W - mr, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }));
    svg.append(s("text", { x: ml - 6, y: y(v) + 4, "text-anchor": "end" }, +v.toFixed(2)));
  }
  svg.append(s("line", { x1: ml, x2: W - mr, y1: mt + ih, y2: mt + ih, stroke: "var(--axis)", "stroke-width": 1 }));
  // x ticks: first, middle, last date of range
  const spanDays = (t1 - t0) / 864e5;
  const nt = Math.max(2, Math.min(5, Math.floor(iw / 90)));
  for (let i = 0; i < nt; i++) {
    const d = isoD(new Date(t0 + (t1 - t0) * i / (nt - 1)));
    const lbl = spanDays > 400 ? `${MONTHS[parseD(d).getUTCMonth()]} ${d.slice(2, 4)}` : fmtD(d);
    svg.append(s("text", { x: x(d), y: H - 5, "text-anchor": i === 0 ? "start" : i === nt - 1 ? "end" : "middle" }, lbl));
  }
  const pathFor = arr => {
    let d = "", prev = null;
    for (const p of arr) {
      const gap = prev && (parseD(p.d) - parseD(prev.d)) / 864e5 > 3;
      d += `${!prev || gap ? "M" : "L"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`;
      prev = p;
    }
    return d;
  };
  svg.append(s("path", { d: pathFor(pts), fill: "none", stroke: "var(--accent)", "stroke-width": 1.5, opacity: .35, "stroke-linejoin": "round" }));
  svg.append(s("path", { d: pathFor(avg), fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  const last = avg.at(-1);
  svg.append(s("circle", { cx: x(last.d), cy: y(last.v), r: 4, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));
  const cross = s("line", { y1: mt, y2: mt + ih, stroke: "var(--axis)", "stroke-width": 1, opacity: 0 });
  const dot = s("circle", { r: 4, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2, opacity: 0 });
  svg.append(cross, dot);
  const tip = makeTip(wrap);
  const hit = s("rect", { x: ml, y: 0, width: iw, height: H, fill: "transparent" });
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    let bi = 0, bd = Infinity;
    pts.forEach((p, i) => { const dd = Math.abs(x(p.d) - px); if (dd < bd) { bd = dd; bi = i; } });
    const p = pts[bi], a = avg[bi];
    cross.setAttribute("x1", x(p.d)); cross.setAttribute("x2", x(p.d)); cross.setAttribute("opacity", 1);
    dot.setAttribute("cx", x(p.d)); dot.setAttribute("cy", y(p.v)); dot.setAttribute("opacity", 1);
    showTip(tip, wrap, x(p.d) * (r.width / W), 0, fmtDY(p.d), [
      { color: "var(--accent)", faint: true, value: m.fmt(p.v), label: "that day" },
      { color: "var(--accent)", value: m.fmt(a.v), label: "7-day avg" }]);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hideTip(tip); cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); });
  svg.append(hit);
  wrap.prepend(svg);
}

// ---------- sections ----------
function tile(k, v, v2, cls) {
  return h("div", { class: "card tile " + (cls || "") }, h("div", { class: "k", text: k }),
    h("div", { class: "v", text: v }), v2 ? h("div", { class: "v2", text: v2 }) : null);
}
function pairDD(pair) { return pair ? h("dd", null, pair[0], h("span", { class: "alt", text: pair[1] })) : h("dd", { text: "-" }); }

function renderSummary(root, acts, start, today) {
  const all = agg(acts);
  const days = (parseD(today) - parseD(start)) / 864e5 + 1;
  const weeks = days / 7;
  const triDist = acts.filter(a => ["swim", "bike", "run"].includes(a.g)).reduce((b, a) => b + (a.dist || 0), 0);
  root.append(h("div", { class: "grid tiles" },
    h("div", { class: "card tile hero", style: "grid-column: span 2" },
      h("div", { class: "k", text: "Training time" }), h("div", { class: "v", text: fmtDur(all.mt) }),
      h("div", { class: "v2", text: `${fmtDur(all.mt / Math.max(1, weeks))} per week on average` })),
    tile("Sessions", fmtInt(all.n), `${all.days.size} active days of ${fmtInt(days)}`),
    tile("Swim · bike · run distance", ...distPair("km", triDist)),
    tile("Relative effort", fmtInt(all.re), "Strava, summed")));
}

function renderDisciplines(root, acts) {
  const grid = h("div", { class: "grid" });

    const list = acts.filter(a => a.g === d.key);
    const o = agg(list);

      h("header", null, h("span", { class: "sw", style: `background:${d.color}` }), h("h3", { text: d.label }),

    if (!o.n) { card.append(h("div", { class: "empty", text: "No sessions in this period." })); grid.append(card); continue; }
    if (d.kind) {
      const dp = distPair(d.key === "swim" ? "swim" : "km", o.dist);
      card.append(h("div", { class: "big" }, dp[0], h("small", { text: dp[1] })));
    } else {
      card.append(h("div", { class: "big" }, fmtDur(o.mt), h("small", { text: "moving" })));
    }
    const kv = h("dl", { class: "kv" });
    const row = (k, dd) => kv.append(h("dt", { text: k }), dd);
    if (d.kind) row("Moving time", h("dd", { text: fmtDur(o.mt) }));
    row("Per session", d.kind && o.dist
      ? pairDD([distPair(d.key === "swim" ? "swim" : "km", o.dist / o.n)[0], fmtDur(o.mt / o.n)])
      : h("dd", { text: fmtDur(o.mt / o.n) }));
    if (d.kind) row(d.kind === "speed" ? "Avg speed" : "Avg pace", pairDD(pacePair(d.kind, o.dist, o.distMt)));
    row("Avg heart rate", h("dd", { text: o.hr ? `${Math.round(o.hr)} bpm` : "-" }));
    row("Highest max HR", h("dd", { text: o.mhr ? `${Math.round(o.mhr)} bpm` : "-" }));
    if (d.elev) row("Elevation gain", pairDD(elevPair(o.elev)));
    if (d.power && o.pw) row("Avg power (meter)", h("dd", { text: `${Math.round(o.pw)} W` }));
    if (d.kind && o.longest) {
      const lp = distPair(d.key === "swim" ? "swim" : "km", o.longest.dist);
      row("Longest", h("dd", null, lp[0], h("span", { class: "alt", text: `${lp[1]} · ${fmtD(o.longest.d)}` })));
      const f = fastestOf(list, d.fastMin);
      if (f) {
        const fp = pacePair(d.kind, f.dist, f.mt);
        const minLbl = d.key === "swim" ? `${d.fastMin} m+` : `${d.fastMin / 1000} km+`;
        row(`Fastest (${minLbl})`, h("dd", null, fp[0], h("span", { class: "alt", text: `${fp[1]} · ${fmtD(f.d)}` })));
      }
    }
    row("Relative effort", h("dd", { text: fmtInt(o.re) }));
    if (d.key === "other") {
      const by = {};
      for (const a of list) (by[a.s] ||= []).push(a);
      Object.entries(by).sort((a, b) => agg(b[1]).mt - agg(a[1]).mt).forEach(([sp, l]) =>
        row(sp.replace(/([a-z])([A-Z])/g, "$1 $2"), h("dd", { text: `${l.length} · ${fmtDur(agg(l).mt)}` })));
    }
    card.append(kv);
    grid.append(card);
  }
  root.append(grid);
}

function bucketize(acts, start, today) {
  const days = (parseD(today) - parseD(start)) / 864e5 + 1;
  const monthly = days > 26 * 7;
  let from = start;
  if (!monthly && days < 56) from = addDays(today, -55);   // show at least 8 weeks of context
  const keyOf = d => monthly ? d.slice(0, 7) : mondayOf(d);
  const buckets = [], idx = {};
  if (monthly) {
    let y = +from.slice(0, 4), mo = +from.slice(5, 7);
    const ey = +today.slice(0, 4), em = +today.slice(5, 7);
    while (y < ey || (y === ey && mo <= em)) {
      const k = `${y}-${pad2(mo)}`;
      idx[k] = buckets.length;
      buckets.push({ key: k, short: mo === 1 || buckets.length === 0 ? `${MONTHS[mo - 1]} ${String(y).slice(2)}` : MONTHS[mo - 1],
        label: `${MONTHS[mo - 1]} ${y}`, v: {} });
      if (++mo > 12) { mo = 1; y++; }
    }
  } else {
    for (let d = mondayOf(from); d <= today; d = addDays(d, 7)) {
      idx[d] = buckets.length;
      buckets.push({ key: d, short: fmtD(d), label: `Week of ${fmtDY(d)}`, v: {} });
    }
  }
  buckets.forEach(b => { b.dist = {}; });
  for (const a of acts) {
    if (a.d < from || a.d > today) continue;
    const b = buckets[idx[keyOf(a.d)]];
    if (!b) continue;
    b.v[a.g] = (b.v[a.g] || 0) + (a.mt || 0) / 3600;
    if (a.dist > 0) b.dist[a.g] = (b.dist[a.g] || 0) + a.dist;
  }
  return { buckets, monthly };
}

function renderVolume(root, allActs, start, today) {

  const per = monthly ? "month" : "week";

    h("span", { class: "muted", style: "font-size:12px", text: "hours, by discipline" })));
  c1.append(h("div", { class: "legend" }, DISC.map(d => h("span", null, h("span", { class: "sw", style: `background:${d.color}` }), d.label))));
  const w1 = h("div", { class: "chart" });
  c1.append(w1);

  const tbl = h("table", null, h("thead", null, h("tr", null, h("th", { text: monthly ? "Month" : "Week of" }),
    DISC.map(d => h("th", { class: "n", text: d.label })), h("th", { class: "n", text: "Total" }))),
    h("tbody", null, buckets.slice().reverse().map(b => h("tr", null, h("td", { text: monthly ? b.label : fmtDY(b.key) }),
      DISC.map(d => h("td", { class: "n", text: b.v[d.key] ? fmtDur(b.v[d.key] * 3600) : "-" })),
      h("td", { class: "n", text: fmtDur(DISC.reduce((a, d) => a + (b.v[d.key] || 0), 0) * 3600) })))));
  c1.append(h("details", { class: "table" }, h("summary", { text: "Show as table" }), h("div", { class: "tscroll" }, tbl)));

  // Distance for one discipline
  const c2 = h("div", { class: "card" });
  const unitLbl = () => state.distDisc === "swim" ? (state.unit === "mi" ? "yd" : "m") : state.unit;
  const conv = m => state.distDisc === "swim" ? (state.unit === "mi" ? m * YD_PER_M : m)
    : state.unit === "mi" ? m / M_PER_MI : m / 1000;
  const segD = h("div", { class: "seg", role: "group", "aria-label": "Discipline" },
    ["run", "bike", "swim"].map(k => h("button", { type: "button", "aria-pressed": String(state.distDisc === k),

  c2.append(h("div", { class: "chart-head" }, h("h3", { text: `${DISC_BY[state.distDisc].label} distance per ${per}` }), segD));
  const w2 = h("div", { class: "chart", style: "margin-top:8px" });
  c2.append(w2);
  root.append(h("div", { style: "display:grid;gap:12px" }, c1, c2));
  const draw = () => {
    columnChart(w1, buckets, series, v => fmtDur(v * 3600), v => `${+v.toFixed(1)}h`);
    const db = buckets.map(b => ({ ...b, v: { [state.distDisc]: conv(b.dist[state.distDisc] || 0) } }));
    const u = unitLbl();
    columnChart(w2, db, [{ key: state.distDisc, label: DISC_BY[state.distDisc].label, color: DISC_BY[state.distDisc].color }],
      v => `${u === "m" || u === "yd" ? fmtInt(v) : v.toFixed(1)} ${u}`, v => fmtInt(v));
  };
  drawQueue.push(draw);
}

function recoveryStatus(v) {
  if (v >= 67) return { c: "var(--good)", l: "Green" };
  if (v >= 34) return { c: "var(--warning)", l: "Yellow" };
  return { c: "var(--critical)", l: "Red" };
}
function renderWhoop(root, start, today) {
  const rows = DATA.whoop.filter(w => w.d >= start && w.d <= today);
  if (!DATA.whoop.length) { root.append(h("p", { class: "empty", text: "No WHOOP data synced yet." })); return; }
  root.append(h("div", { class: "legend" },
    h("span", null, h("span", { class: "line faint", style: "background:var(--accent)" }), "Daily value"),
    h("span", null, h("span", { class: "line", style: "background:var(--accent)" }), "7-day average")));
  const grid = h("div", { class: "whoop-grid" });
  let shown = 0;
  for (const m of WHOOP_METRICS) {
    const pts = rows.filter(r => r[m.k] != null).map(r => ({ d: r.d, v: r[m.k] }));
    const allPts = DATA.whoop.filter(r => r[m.k] != null);
    if (!allPts.length) continue;
    shown++;
    const latest = allPts.at(-1);
    const avg = pts.length ? pts.reduce((a, p) => a + p.v, 0) / pts.length : null;
    const card = h("div", { class: "card whoop-card" }, h("h3", { text: m.label }));
    const now = h("div", { class: "now" }, h("span", { class: "v", text: m.fmt(latest[m.k]) }),
      h("span", { class: "d", text: latest.d === today ? "today" : fmtD(latest.d) }));
    if (m.status) { const st = recoveryStatus(latest[m.k]); now.append(h("span", { class: "status" }, h("i", { style: `background:${st.c}` }), st.l)); }
    if (avg != null) now.append(h("span", { class: "d", text: `· period avg ${m.fmt(avg)}` }));
    card.append(now);
    const w = h("div", { class: "chart" });
    card.append(w);
    if (pts.length >= 2) drawQueue.push(() => lineChart(w, pts, m, [start, today]));
    else w.append(h("div", { class: "empty", text: "Not enough data in this period." }));
    grid.append(card);
  }
  root.append(grid);
  if (!shown) root.append(h("p", { class: "empty", text: "No WHOOP metrics available." }));
}

function renderVo2(root) {
  const v = DATA.vo2max || [];
  const card = h("div", { class: "card" });
  if (!v.length) card.append(h("div", { class: "empty", text: "No readings logged." }));
  else {
    const latestBy = {};
    for (const r of v) latestBy[r.source] = r;
    card.append(h("div", { class: "grid tiles", style: "margin-bottom:12px" }, Object.values(latestBy).map(r =>
      h("div", { class: "tile" }, h("div", { class: "k", text: `${r.source[0].toUpperCase()}${r.source.slice(1)} estimate` }),
        h("div", { class: "v", text: `${r.vo2max}` }), h("div", { class: "v2", text: `ml/kg/min · ${fmtDY(r.date)}` })))));
    card.append(h("div", { class: "tscroll" }, h("table", null,
      h("thead", null, h("tr", null, h("th", { text: "Date" }), h("th", { text: "Source" }), h("th", { class: "n", text: "VO2 max" }), h("th", { text: "Note" }))),
      h("tbody", null, v.slice().reverse().map(r => h("tr", null, h("td", { text: fmtDY(r.date) }), h("td", { text: r.source }),
        h("td", { class: "n", text: String(r.vo2max) }), h("td", { class: "name ink2", text: r.note || "" })))))));
  }
  root.append(card);
}

function renderActivities(root, acts) {
  const card = h("div", { class: "card" });
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Activity type" },
    [{ key: "all", label: "All" }, ...DISC].map(d => h("button", { type: "button", "aria-pressed": String(state.actFilter === d.key),
      onclick: () => { state.actFilter = d.key; state.actLimit = 30; render(); }, text: d.label })));
  const search = h("input", { type: "search", placeholder: "Search names", value: state.actQuery, "aria-label": "Search activities" });
  search.addEventListener("input", () => { state.actQuery = search.value; state.actLimit = 30; renderActTable(); });
  card.append(h("div", { class: "toolbar" }, seg, search));
  const holder = h("div");
  card.append(holder);
  function renderActTable() {
    const qq = state.actQuery.trim().toLowerCase();
    const l = acts.filter(a => (state.actFilter === "all" || a.g === state.actFilter) &&
      (!qq || a.n.toLowerCase().includes(qq) || a.s.toLowerCase().includes(qq)));
    const cell = pair => pair ? h("td", { class: "n" }, pair[0], h("br"), h("span", { class: "alt", text: pair[1] })) : h("td", { class: "n", text: "-" });
    const tbody = h("tbody", null, l.slice(0, state.actLimit).map(a => {
      const kind = paceKind(a.s, a.g);
      return h("tr", null,
        h("td", { class: "num" }, fmtD(a.d), h("br"), h("span", { class: "alt", text: a.t })),
        h("td", { title: a.s }, h("span", { class: "sw", style: `background:${DISC_BY[a.g].color};margin-right:6px` }), h("span", { class: "tname", text: a.s.replace(/([a-z])([A-Z])/g, "$1 $2") })),
        h("td", { class: "name" }, a.id ? h("a", { href: `https://www.strava.com/activities/${encodeURIComponent(a.id)}`, target: "_blank", rel: "noopener noreferrer", text: a.n }) : a.n),
        a.dist > 0 ? cell(distPair(a.g === "swim" ? "swim" : "km", a.dist)) : h("td", { class: "n", text: "-" }),
        h("td", { class: "n", text: fmtClock(a.mt) }),
        cell(a.dist > 0 ? pacePair(kind, a.dist, a.mt) : null),
        h("td", { class: "n", text: a.hr ? Math.round(a.hr) : "-" }),
        h("td", { class: "n", text: a.mhr ? Math.round(a.mhr) : "-" }),
        a.elev ? cell(elevPair(a.elev)) : h("td", { class: "n", text: "-" }),
        h("td", { class: "n", text: a.pw ? `${Math.round(a.pw)}${a.realpw ? "" : "*"}` : "-" }),
        h("td", { class: "n", text: a.re != null ? a.re : "-" }));
    }));
    const table = h("table", null, h("thead", null, h("tr", null,
      ["Date", "Type", "Name"].map(t => h("th", { text: t })),
      ["Distance", "Moving", "Pace / speed", "Avg HR", "Max HR", "Elev.", "Power", "Effort"].map(t => h("th", { class: "n", text: t })))), tbody);
    holder.replaceChildren(
      h("div", { class: "sub", style: "margin:0 0 6px", text: `${l.length} activit${l.length === 1 ? "y" : "ies"} in this period${l.length > state.actLimit ? `, showing ${state.actLimit}` : ""}. Power marked * is estimated by Strava.` }),
      h("div", { class: "tscroll" }, table),
      l.length > state.actLimit ? h("button", { class: "btn more", type: "button", text: "Show more",
        onclick: () => { state.actLimit += 50; renderActTable(); } }) : null);
  }
  renderActTable();
  root.append(card);
}

function renderAllTime(root) {
  const grid = h("div", { class: "grid tiles" });
  for (const d of DISC.filter(d => d.kind)) {
    const list = DATA.activities.filter(a => a.g === d.key);
    const o = agg(list);
    if (!o.longest) continue;
    const lp = distPair(d.key === "swim" ? "swim" : "km", o.longest.dist);
    grid.append(tile(`Longest ${d.label.toLowerCase()}`, lp[0], `${lp[1]} · ${fmtDY(o.longest.d)}`));
    const tot = distPair(d.key === "swim" ? "swim" : "km", o.dist);
    grid.append(tile(`Total ${d.label.toLowerCase()}`, tot[0], `${tot[1]} · ${o.n} sessions`));
  }
  const weeks = {};
  for (const a of DATA.activities) { const k = mondayOf(a.d); weeks[k] = (weeks[k] || 0) + (a.mt || 0); }
  const bw = Object.entries(weeks).sort((a, b) => b[1] - a[1])[0];
  if (bw) grid.append(tile("Biggest week", fmtDur(bw[1]), `Week of ${fmtDY(bw[0])}`));
  root.append(grid);
}

// ---------- page ----------
let drawQueue = [];
function section(title, sub) {
  const el = h("section");
  el.append(h("h2", { text: title }));
  if (sub) el.append(h("p", { class: "sub", text: sub }));
  return el;
}
function render() {
  const today = todayLocal();
  const start = periodStart(state.period, today);
  const acts = DATA.activities.filter(a => a.d >= start && a.d <= today);
  const p = PERIODS.find(p => p.key === state.period);
  drawQueue = [];
  const scrollY = window.scrollY;
  const gen = new Date(DATA.generated_at);
  const genTxt = gen.toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const wrap = h("div", { class: "wrap" });
  wrap.append(h("header", { class: "top" },
    h("div", null, h("h1", { text: "Training dashboard" }),
      h("div", { class: "meta", text: `Synced ${genTxt} ET · latest activity ${DATA.activities[0] ? fmtD(DATA.activities[0].d) : "-"} · latest WHOOP ${DATA.whoop.at(-1) ? fmtD(DATA.whoop.at(-1).d) : "-"}` })),
    h("button", { class: "btn", type: "button", text: "Lock", onclick: () => { store.del(KEY_STORE); location.reload(); } })));
  wrap.append(h("div", { class: "filters" },
    h("span", { class: "label", text: "Period" }),
    h("div", { class: "seg", role: "group", "aria-label": "Period" }, PERIODS.map(pp => h("button", { type: "button",
      "aria-pressed": String(pp.key === state.period), text: pp.label,
      onclick: () => { state.period = pp.key; state.actLimit = 30; store.set("td.period", pp.key); render(); } }))),
    h("span", { class: "label", text: "Chart units" }),
    h("div", { class: "seg", role: "group", "aria-label": "Chart units" }, ["km", "mi"].map(u => h("button", { type: "button",
      "aria-pressed": String(u === state.unit), text: u,
      onclick: () => { state.unit = u; store.set("td.unit", u); render(); } })))));

  const rangeTxt = `${fmtDY(start)} – ${fmtDY(today)}`;
  const s1 = section(`Highlights · ${p.label}`, rangeTxt); renderSummary(s1, acts, start, today);
  const s2 = section("By discipline", "Distances in km and miles (swim in meters and yards). Pace and speed use moving time; heart rate is time-weighted."); renderDisciplines(s2, acts);
  const s3 = section("Volume", "At least 8 weeks are shown for short periods; periods over 6 months are grouped by month."); renderVolume(s3, DATA.activities, start, today);
  const s4 = section("Recovery & physiology (WHOOP)", rangeTxt); renderWhoop(s4, start, today);
  const s5 = section("VO2 max", "Logged by hand: the WHOOP and Strava APIs don't expose VO2 max. Wearable estimates; treat as a trend, not a lab value."); renderVo2(s5);
  const s6 = section("Activities", rangeTxt); renderActivities(s6, acts);
  const s7 = section("All-time", "Ignores the period filter."); renderAllTime(s7);
  wrap.append(s1, s2, s3, s4, s5, s6, s7,
    h("footer", { text: "Data from Strava and WHOOP, refreshed about every 6 hours. Encrypted at rest; decrypted only in this browser." }));
  appEl.replaceChildren(wrap);
  drawQueue.forEach(f => f());
  window.scrollTo(0, scrollY);
}

let lastW = 0;
function start(data) {
  DATA = data;
  lockEl.remove();
  appEl.hidden = false;
  render();
  lastW = window.innerWidth;
  let t;
  window.addEventListener("resize", () => {
    if (window.innerWidth === lastW) return;   // ignore mobile URL-bar height changes
    lastW = window.innerWidth;
    clearTimeout(t); t = setTimeout(() => drawQueue.forEach(f => f()), 150);
  });
}

tryRemembered();
})();
</script>
</body>
</html>
